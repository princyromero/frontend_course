<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM PROCESS</title>
</head>
<body>
    

    <h1>Employee Registration System</h1>

    <form id="employeeForm">
        <label>Employee Name</label>
        <input type="text" id="empName" placeholder="Enter name">

        <label>Employee Age</label>
        <input type="number" id="empAge" placeholder="Enter age">

        <label>Department</label>
        <input type="text" id="empDepartment" placeholder="Enter department">

        <label>Salary</label>
        <input type="number" id="empSalary" placeholder="Enter salary">

        <button type="submit">Submit</button>
    </form>

    <h2>Employee Records</h2>

    <table cellpadding="10">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Department</th>
                <th>Salary</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="employeeTable"></tbody>
    </table>



    <script src="task.js"></script>
</body>
</html>
