<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DECATHLON</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    

<div class="container-fluid bg-white py-3 ">
    <div class="row align-items-center">
        <div class="col-lg-2 col-md-3 col-12 mb-3 mb-lg-0">
            <div class="fw-bold fs-3 text-primary">
                DECATHLON
            </div>
         </div>
         
         
         <div class="col-lg-6 col-md-5 col-12 mb-3 mb-lg-0">
            <div class="d-flex align-items-center bg-light rounded-pill px-4 py-2">
                <div class="bi bi-search fs-5 me-3"></div>
                <span class="form-control border-0 bg-transparent shadow-none"
                    placeholder='Search for "Jackets"'>🔎Search</span>
            </div>
        </div>
        
        
        <div class="col-lg-4 col-md-4 col-12">
            <div class="d-flex justify-content-around text-center">
                <div>
                    <div class="bi bi-person fs-4"></div>
                    <div>Sign In</div>
                </div>

                <div>
                    <i class="bi bi-shop fs-4"></i>
                    <div>My Store</div>
                </div>

                <div>
                    <div class="bi bi-question-circle fs-4"></div>
                    <div>Support</div>
                </div>

                <div>
                    <div class="bi bi-heart fs-4"></div>
                    <div>Wishlist</div>
                </div>

                <div>
                    <div class="bi bi-bag fs-4"></div>
                    <div>cart</div>
                </div>
            </div>
        </div>
    </div>


    <div class="container-fluid mt-4">
        <div class="d-flex gap-5">
            
            <div>All Sports</div>
            <div>Men</div>
            <div>Women</div>
            <div>Kids</div>

        </div>

    </div>

</div>



<div class="container-fluid p-0">
    
    <div class="carousel slide" data-bs-ride="carousel" data-bs-interval="2000" data-bs-touch="true">
        <div class="carousel-inner">


<div class="container-fluid p-0">
<div class="carousel slide">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <div class="carousel-inner">
            <div class="carousel-item active">
                <div>
                    <img src="../assets/images/cards.avif" alt="">
                </div>
            </div>


            <div class="carousel-item">
                <div>
                    <img src="../assets/images/offers.avif" alt="">
                </div>
            </div> 
        </div>
    </div>

</div>
</div>
   

<div class="container my-4">
     <div class="row g-3"> 
         <div class="col-12 col-sm-6 col-md-3"> 
            <div class="card border-0 rounded-3 text-white overflow-hidden shadow-sm"> 
                <img src="../assets/images/Bags.avif" class="card-img object-fit-cover" alt="New Arrivals" style="height: 250px;">
                 <div class="card-img-overlay d-flex align-items-end p-2"> 
                    <div class="bg-dark bg-opacity-75 px-3 py-1 rounded w-100 text-center"> 
                    </div> 
                </div> 
            </div> 
        </div>
    
 
         <div class="col-12 col-sm-6 col-md-3"> 
            <div class="card border-0 rounded-3 text-white overflow-hidden shadow-sm"> 
                <img src="../assets/images/hiking.avif" class="card-img object-fit-cover" alt="" style="height: 250px;">
                 <div class="card-img-overlay d-flex align-items-end p-2"> 
                    <div class="bg-dark bg-opacity-75 px-3 py-1 rounded w-100 text-center"> 
                    </div> 
                </div> 
            </div> 
        </div>

        <div class="col-12 col-sm-6 col-md-3"> 
            <div class="card border-0 rounded-3 text-white overflow-hidden shadow-sm"> 
                <img src="../assets/images/Shoes.avif" class="card-img object-fit-cover" alt="New Arrivals" style="height: 250px;">
                 <div class="card-img-overlay d-flex align-items-end p-2"> 
                    <div class="bg-dark bg-opacity-75 px-3 py-1 rounded w-100 text-center"> 
                    </div> 
                </div> 
            </div> 
        </div>

        <div class="col-12 col-sm-6 col-md-3"> 
            <div class="card border-0 rounded-3 text-white overflow-hidden shadow-sm"> 
                <img src="../assets/images/Sports.avif" class="card-img object-fit-cover" alt="" style="height: 250px;">
                 <div class="card-img-overlay d-flex align-items-end p-2"> 
                    <div class="bg-dark bg-opacity-75 px-3 py-1 rounded w-100 text-center"> 
                    </div> 
                </div> 
            </div> 
        </div>
    
    </div>
</div>


<div class="container-fluid p-0">


    <div id="decathlonSlider" class="carousel slide"data-bs-ride="carousel"data-bs-interval="2000" data-bs-touch="true">

        <div class="carousel-inner">

            <div class="carousel-item active">
                <img src="../assets/images/frnds.avif" class="d-block w-100" ;height:500px; object-fit:cover;">

                <div class="carousel-caption text-start">
                    
                    <button class="btn btn-light"> </button>
                </div>
            </div>

            <div class="carousel-item">
                <img src="../assets/images/shps.avif" class="d-block w-100 ;height:500px; object-fit:cover;">
                <div class="carousel-caption text-start">
                    <button class="btn btn-light"> </button>
                </div>
            </div>


        <button class="carousel-control-next"
                type="button"
                data-bs-target="#decathlonSlider"
                data-bs-slide="next">

            <span class="carousel-control-next-icon"></span>

        </button>

        <div class="carousel-indicators">

            <button type="button"
                    data-bs-target="#decathlonSlider"
                    data-bs-slide-to="0"
                    class="active"></button>

            <button type="button"
                    data-bs-target="#decathlonSlider"
                    data-bs-slide-to="1"></button>


        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


    

</body>
</html>
